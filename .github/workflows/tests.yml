name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Light dependencies only: the tests use stand-in embedders, scorers and LLMs,
      # so no model downloads or PyTorch are needed.
      - name: Install
        run: pip install tree-sitter tree-sitter-python jedi networkx numpy anthropic pytest
      - name: Test
        run: python -m pytest -q tests
